[project]
name = "filefalconpro"
version = "2.0.0"
description = "Sort, organise and de-duplicate photos, videos and documents."
authors = [{ name = "drobertson-dev" }]
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "PyQt6>=6.7.0,<7",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "send2trash>=1.8",
]

[project.urls]
Homepage = "https://github.com/drobertson-dev/FileFalconPro"
Documentation = "https://github.com/drobertson-dev/FileFalconPro/tree/master/docs"
Issues = "https://github.com/drobertson-dev/FileFalconPro/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.1",
]
build = [
    "pyinstaller>=6.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
lint.fixable = ["ALL"]
lint.select = [
    "E",
    "F",
    "I"
]
lint.ignore = [
    "E101",
    "E203",
    "E501",
    "E231",
]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
docstring-code-line-length = 20
