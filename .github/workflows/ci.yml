name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  app:
    name: macOS app
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the app and disk image
        run: ./scripts/build_macos.sh --dmg
      - name: Self-test the bundle
        run: '"dist/File Falcon Pro.app/Contents/MacOS/File Falcon Pro" --check'
      - uses: actions/upload-artifact@v4
        with:
          name: FileFalconPro-macOS
          path: dist/*.dmg
